<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f4f6">
  <title>ProbaFoot</title>
  <meta name="description" content="Probabilités de matchs de football, comparées aux cotes du marché.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/style.css?v=7">
</head>
<body>
  <!-- Décor : terrain en perspective + lueurs. Tout ce qui est flou vit ici, derrière le verre. -->
  <div class="scene" aria-hidden="true" id="scene">
    <i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i>
    <div class="pitch">
      <svg viewBox="0 0 1000 420" preserveAspectRatio="none"><rect x="40" y="10" width="920" height="400" rx="4"/><path d="M500 10V410"/><circle cx="500" cy="210" r="86"/><rect x="40" y="110" width="130" height="200"/><rect x="830" y="110" width="130" height="200"/></svg>
    </div>
  </div>

  <header class="topbar" id="topbar">
    <a class="brandmark" href="#/" aria-label="ProbaFoot, accueil">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M16 2v28" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="5" fill="var(--accent)" stroke="currentColor" stroke-width="2.2"/></svg>
      <span>ProbaFoot</span>
    </a>
    <span class="bartitle" id="bartitle"></span>
    <button class="round press" id="theme" type="button" aria-label="Changer de thème" title="Changer de thème">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>
    </button>
  </header>

  <main class="shell" id="app" aria-live="polite"></main>

  <nav class="tabbar glass" id="tabbar" aria-label="Navigation principale">
    <i class="lens" id="lens"></i>
    <a href="#/" data-nav="matchs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M12 5v14"/><circle cx="12" cy="12" r="3"/></svg><span>Matchs</span></a>
    <a href="#/avenir" data-nav="avenir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>À venir</span></a>
    <a href="#/performance" data-nav="performance"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M8 15l3.5-4 3 2.5L19 7"/></svg><span>Performance</span></a>
    <a href="#/estimer" data-nav="estimer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8" fill="currentColor"/></svg><span>Estimer</span></a>
  </nav>

  <!-- Feuille modale : fiche d'un match -->
  <div class="sheet" id="sheet" hidden>
    <div class="sheet-backdrop" id="sheet-backdrop"></div>
    <section class="sheet-panel glass-strong" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-grab" aria-hidden="true"></div>
      <button class="round press sheet-close" id="sheet-close" type="button" aria-label="Fermer"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="sheet-body" id="sheet-body"></div>
    </section>
  </div>

  <div class="tip glass-strong" id="tip" role="tooltip"></div>
  <script type="module" src="/app.js?v=7"></script>
</body>
</html>
